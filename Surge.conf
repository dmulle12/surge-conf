#!name=Surge 5 iOS Main Configuration
#!desc=Remote-hosted main config; rules and modules are maintained in this repository

[General]
# > Logging and diagnostics
loglevel = notify
show-error-page-for-reject-skip-proxy = true
ipv6-support = false
test-timeout = 5
wifi-assist = true
allow-wifi-access = false
compatibility-mode = 3
internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204
proxy-test-url = http://latency-test.skk.moe/endpoint
proxy-test-udp = www.apple.com@8.8.8.8

# > DNS settings
dns-server = 1.1.1.1, 1.0.0.1
encrypted-dns-server = https://cloudflare-dns.com/dns-query
doh-follow-outbound-mode = false
# Route encrypted DNS through proxy (comment out if not needed)
# encrypted-dns-follow-outbound-mode = true

# > Network
skip-proxy = 127.0.0.1, localhost, *.local, captive.apple.com
keep-alive-idle = 300

# > Other
http-listen = 0.0.0.0:6152
socks5-listen = 0.0.0.0:6153
always-reject-url-rewrite = false
exclude-simple-hostnames = true
read-etc-hosts = true
all-rule-modules = false

[Replica]
# > Hide packet-capture information (keep enabled before sharing config)
hide-apple-request = true
hide-crashlytics-request = true
# Hide IP resolution for client custom Host entries
use-keyword-filter = false
hide-udp = false

[Proxy Group]
🎯Proxy = select, DIRECT, no-alert=0, hidden=0, include-all-proxies=0
🇨🇳CN Return = select, DIRECT, no-alert=0, hidden=0, include-all-proxies=0

[Rule]
AND,((PROTOCOL,UDP), (DEST-PORT,443)),REJECT-NO-DROP
RULE-SET,https://raw.githubusercontent.com/dmulle12/surge-conf/main/Rules/Lan.list,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/dmulle12/surge-conf/main/Rules/Adblock.txt,REJECT
RULE-SET,https://raw.githubusercontent.com/dmulle12/surge-conf/main/Rules/Study.list,🎯Proxy
RULE-SET,https://raw.githubusercontent.com/dmulle12/surge-conf/main/Rules/Douyin.list,🎯Proxy,extended-matching
RULE-SET,https://raw.githubusercontent.com/dmulle12/surge-conf/main/Rules/Apple.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/dmulle12/surge-conf/main/Rules/Proxy.list,🎯Proxy
RULE-SET,https://raw.githubusercontent.com/dmulle12/surge-conf/main/Rules/Direct.list,DIRECT
# > Fallback rules
GEOIP,CN,🇨🇳CN Return
FINAL,DIRECT,dns-failed

[Host]
# Local hosts overrides, add as needed
# *.example.com = server:127.0.0.1

[MITM]
# After first install, generate and trust certificate in Surge
# hostname = add as needed, for example *.example.com
skip-server-cert-verify = true
